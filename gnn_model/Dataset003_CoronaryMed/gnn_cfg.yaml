sample_percent:  1.0
image_glob:  "*.nii.gz"

# Node sampling (from prob/seg only)
prob_threshold: 0.35
voxel_subsample_zyx: [4,4,4]
include_shell_dilate_vox: 1

# Band where outside nodes are allowed
nms_radius_vox: [4,4,4]
target_outside_ratio: 0.35  # cap outside fraction

# Graph edges
knn_k: 12
knn_radius_mm: 6.0
max_edge_len_mm: 8.0

# Gap/bridge proposals
gap_r_mm: 60.0
gap_cos_min: 0.60
gap_dr_mm_max: 10

# Edge features (geometry-only)
use_line_integrals: True
n_line_samples: 24
vesselness_floor: 0.5

# Labeling from GT connectivity
gt_dilate_vox: 1
pos_path_max_mm: 15.0

# Training
train_enable: True
neg_per_pos: 8
batch_size_cases: 1
max_epochs: 70
base_lr: 1e-3
weight_decay: 3e-4
amp: True
seed: 100

# Inference / export
infer_enable: True
edge_prob_thresh: 0.6
add_back_thresh: 0.85
mst_lambda_len_inv: 0.05
export_candidates_vtp: True
export_mst_preview_vtp: True
export_predicted_vtp: True

# Vessel belt (kept)
belt_shells_mm: [0.8, 1.6, 2.4, -0.6]
belt_step_mm: 1.0
belt_prob_max: 0.50
belt_vesselness_min: 0.12
belt_band_half_mm: 0.5
belt_nms_vox: [2,2,2]
belt_max_points: 40000

# Checkpoint
ckpt_name: "gnn_checkpoint.pt"


# Aggressive settings for maximum coverage

# Node sampling - VERY PERMISSIVE
node_step_mm: 1.0          # Dense grid
seg_node_thresh: 0.15      # Low threshold
node_keep_frac: 0.60       # Keep 60% of candidates

# Edge construction - LONG RANGE
radius_max_mm: 18.0        # Large radius
delaunay_max_mm: 30.0      # Large max distance
seg_line_thresh: 0.20      # Very permissive


# Training - LONGER
epochs: 70
lr: 1e-4
