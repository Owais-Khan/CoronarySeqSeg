# Predict segmentation as we go (no pre-made seg)
SEGMENTATION: False

DEBUG: False
DEBUG_STEP: 0

# Disable animation/QA dumps while stabilizing
ANIMATION: False
ANIMATION_STEPS: 10

RETRACE: False
TIME_ANALYSIS: False
TREE_ANALYSIS: False

# Windows & growth (coronaries)
VOLUME_SIZE_RATIO: 15    # 7–8 is good; 8 is okay too
MAGN_RADIUS: 1.75          # bigger first look
ADD_RADIUS: 0.0
MAX_PERC_ENLARGE: 0.5      # allow enlarging when lots of blood is present

MIN_RADIUS: 0.40           # allow thin starts
MIN_RES: 1               # **was 32**; use 0.6–1.0 mm range
CENTERLINE_EXTRACTION_VMTK: False
TYPE_CENT: profileidlist

NR_CHANCES: 4              # extra retries help when a cap fails
NR_ALLOW_RETRACE_STEPS: 10
PREVENT_RETRACE: True
SORT_NEXT: True
MERGE_NEXT: True

# Assembly: write less often during stabilization
ASSEMBLY_EVERY_N: 10
USE_BUFFER: True
BUFFER_N: 4
WEIGHTED_ASSEMBLY: False   # simpler while debugging
WEIGHT_TYPE: gaussian

# Branching
FORCEFUL_SIDEBRANCH: True
FORCEFUL_SIDEBRANCH_MAGN_RADIUS: 1.6

# Early mega windows help first cap(s), but don’t let them explode
MEGA_SUBVOLUME: True
NR_MEGA_SUB: 2

# Stop before drifting to ROI borders
STOP_PRE: True
STOP_RADIUS: 0.40
MAX_STEPS_BRANCH: 100

RESTART_BRANCH: True
